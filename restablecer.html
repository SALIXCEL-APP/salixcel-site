<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restablecer contraseña — SALIXCEL</title>
<style>
  :root { --brand: #6B2FB3; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse 120% 60% at 50% 0%, #4A2896 0%, #2a1a5e 45%, #17122b 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: #1C1C1A; }
  .card { background: #fff; width: 100%; max-width: 400px; border-radius: 22px; padding: 28px 24px; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
  .logo { width: 48px; height: 48px; border-radius: 14px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; margin: 0 auto 14px; }
  h1 { font-size: 19px; text-align: center; margin: 0 0 4px; }
  p.sub { text-align: center; color: #8A887F; font-size: 13.5px; margin: 0 0 20px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; border: 1px solid #DEDAD0; border-radius: 12px; padding: 12px 14px; font-size: 15px; outline: none; }
  input:focus { border-color: var(--brand); }
  button { width: 100%; margin-top: 20px; background: var(--brand); color: #fff; border: 0; border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 14px; font-size: 13.5px; text-align: center; line-height: 1.5; }
  .msg.err { color: #B23A22; }
  .msg.ok { color: #2E6349; font-weight: 600; }
  .hidden { display: none; }
  .center { text-align: center; color: #8A887F; font-size: 13.5px; padding: 10px 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">S</div>
    <h1>Restablecer contraseña</h1>
    <p class="sub">Elige tu nueva contraseña para tu cuenta de SALIXCEL.</p>

    <div id="loading" class="center">Verificando el enlace…</div>

    <form id="form" class="hidden">
      <label for="pass">Nueva contraseña</label>
      <input id="pass" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" />
      <label for="pass2">Repetir contraseña</label>
      <input id="pass2" type="password" autocomplete="new-password" placeholder="Escríbela otra vez" />
      <button id="btn" type="submit">Guardar contraseña</button>
    </form>

    <div id="expired" class="hidden center">
      Este enlace no es válido o ya expiró.<br />
      Vuelve a la app SALIXCEL y pide un nuevo enlace de "Olvidé mi contraseña".
    </div>

    <div id="msg" class="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
  <script>
    (function () {
      var SUPABASE_URL = "https://xvhpibmsxrkwwjuwpohn.supabase.co";
      var SUPABASE_ANON_KEY = "sb_publishable_qGmWVu_eZfppcZMIT2lJTQ_zmT7yRRD";
      var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { detectSessionInUrl: true, flowType: "implicit", persistSession: false, autoRefreshToken: false }
      });

      var loading = document.getElementById("loading");
      var form = document.getElementById("form");
      var expired = document.getElementById("expired");
      var msg = document.getElementById("msg");
      var ready = false;

      function showForm() { if (ready) return; ready = true; loading.classList.add("hidden"); form.classList.remove("hidden"); }
      function showExpired() { if (ready) return; loading.classList.add("hidden"); expired.classList.remove("hidden"); }

      sb.auth.onAuthStateChange(function (event, session) {
        if (event === "PASSWORD_RECOVERY" || session) showForm();
      });

      // Respaldo: a veces el evento no llega; revisamos si ya hay sesión de recuperación.
      setTimeout(function () {
        sb.auth.getSession().then(function (res) {
          if (res && res.data && res.data.session) showForm();
          else showExpired();
        }).catch(function () { showExpired(); });
      }, 1800);

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        msg.textContent = ""; msg.className = "msg";
        var p = document.getElementById("pass").value;
        var p2 = document.getElementById("pass2").value;
        if (p.length < 6) { msg.textContent = "La contraseña debe tener al menos 6 caracteres."; msg.className = "msg err"; return; }
        if (p !== p2) { msg.textContent = "Las contraseñas no coinciden."; msg.className = "msg err"; return; }
        var btn = document.getElementById("btn");
        btn.disabled = true; btn.textContent = "Guardando…";
        sb.auth.updateUser({ password: p }).then(function (res) {
          if (res && res.error) {
            msg.textContent = "No se pudo cambiar: " + res.error.message;
            msg.className = "msg err";
            btn.disabled = false; btn.textContent = "Guardar contraseña";
            return;
          }
          form.classList.add("hidden");
          msg.innerHTML = "✅ ¡Listo! Tu contraseña se cambió.<br />Vuelve a la app SALIXCEL e inicia sesión con tu nueva contraseña.";
          msg.className = "msg ok";
        }).catch(function (err) {
          msg.textContent = "No se pudo cambiar. Intenta pedir un enlace nuevo.";
          msg.className = "msg err";
          btn.disabled = false; btn.textContent = "Guardar contraseña";
        });
      });
    })();
  </script>
</body>
</html>
