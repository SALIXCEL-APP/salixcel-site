<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cuenta confirmada — SALIXCEL</title>
<style>
  :root { --brand: #6B2FB3; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse 120% 60% at 50% 0%, #4A2896 0%, #2a1a5e 45%, #17122b 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: #1C1C1A; }
  .card { background: #fff; width: 100%; max-width: 400px; border-radius: 22px; padding: 32px 24px; box-shadow: 0 18px 50px rgba(0,0,0,.35); text-align: center; }
  .logo { width: 48px; height: 48px; border-radius: 14px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; margin: 0 auto 16px; }
  .icon { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 4px auto 16px; font-size: 32px; }
  .icon.ok { background: #E4F1EA; color: #2E6349; }
  .icon.warn { background: #FDF3E7; color: #C4813D; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #5B5A54; font-size: 14px; line-height: 1.55; margin: 0; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">S</div>
    <div id="ok" class="hidden">
      <div class="icon ok">✓</div>
      <h1>¡Cuenta confirmada!</h1>
      <p>Tu correo quedó verificado. Ya puedes volver a la app <strong>SALIXCEL</strong> e iniciar sesión con tu correo y contraseña.</p>
    </div>
    <div id="warn" class="hidden">
      <div class="icon warn">!</div>
      <h1>Enlace no válido</h1>
      <p>Este enlace ya se usó o expiró. Si ya habías confirmado tu cuenta, solo vuelve a la app <strong>SALIXCEL</strong> e inicia sesión normalmente.</p>
    </div>
    <div id="loading"><p>Un momento…</p></div>
  </div>
  <script>
    (function () {
      var hash = (window.location.hash || "").toLowerCase();
      var isError = hash.indexOf("error") !== -1;
      document.getElementById("loading").classList.add("hidden");
      document.getElementById(isError ? "warn" : "ok").classList.remove("hidden");
    })();
  </script>
</body>
</html>
